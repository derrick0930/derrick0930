<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="400" viewBox="0 0 1200 400">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="auroraBlue">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraCyan">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <filter id="auroraBlur" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity=".45"/>
    </linearGradient>

    <linearGradient id="borderGradient">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity=".15"/>
    </linearGradient>

    <linearGradient id="techFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="black"/>
      <stop offset="22%" stop-color="black"/>
      <stop offset="48%" stop-color="white"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>

    <mask id="techMask">
      <rect x="570" y="90" width="630" height="150" fill="url(#techFade)"/>
    </mask>

    <linearGradient id="kotlinTop" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F88909"/>
      <stop offset="40%" stop-color="#F88909"/>
      <stop offset="100%" stop-color="#C757BC"/>
    </linearGradient>

    <linearGradient id="kotlinBottom" x1="0.75" y1="0.25" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#2E87E0"/>
    </linearGradient>

    <linearGradient id="kotlinLeft" x1="0.1" y1="0.7" x2="1" y2="0">
      <stop offset="0%" stop-color="#0095D5"/>
      <stop offset="45%" stop-color="#0095D5"/>
      <stop offset="100%" stop-color="#7F52FF"/>
    </linearGradient>

    <style>
      .tech-card {
        fill: #082f49;
        fill-opacity: .82;
        stroke: #38bdf8;
        stroke-opacity: .22;
        stroke-width: 1;
      }

      .tech-label {
        font-family: Arial, sans-serif;
        font-size: 9px;
        fill: #cbd5e1;
        text-anchor: middle;
        letter-spacing: .4px;
      }

      .contact-label {
        font-family: Arial, sans-serif;
        font-size: 10px;
        fill: #7dd3fc;
        letter-spacing: 2px;
      }

      .contact-value {
        font-family: Consolas, monospace;
        font-size: 14px;
        fill: #e0f2fe;
      }

      .contact-link {
        cursor: pointer;
        text-decoration: none;
      }

      .contact-link:hover .contact-card {
        stroke: #7dd3fc;
        stroke-opacity: .85;
      }
    </style>

    <g id="icon-html">
      <path d="M-14 -16 H14 L11 13 L0 18 L-11 13Z" fill="#e44d26"/>
      <path d="M0 -12 V14 L8 11 L10 -12Z" fill="#f16529"/>
      <path d="M-8 -9 H8 L7 -5 H-4 L-3 -1 H7 L5 8 L0 11 L-5 8 L-6 4 H-2 L-1 5 L2 5 L3 3 H-7Z" fill="#fff"/>
    </g>

    <g id="icon-css">
      <path d="M-14 -16 H14 L11 13 L0 18 L-11 13Z" fill="#1572b6"/>
      <path d="M0 -12 V14 L8 11 L10 -12Z" fill="#33a9dc"/>
      <path d="M-8 -9 H8 L7 -5 H-4 L-3 -1 H7 L5 8 L0 11 L-5 8 L-6 4 H-2 L-1 5 L2 5 L3 3 H-7Z" fill="#fff"/>
    </g>

    <g id="icon-js">
      <rect x="-16" y="-16" width="32" height="32" rx="3" fill="#f7df1e"/>
      <text x="0" y="9" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">JS</text>
    </g>

    <g id="icon-php">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#777bb4"/>
      <text x="0" y="4" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">php</text>
    </g>

    <g id="icon-cpp">
      <circle cx="0" cy="0" r="17" fill="#00599c"/>
      <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">C++</text>
    </g>

    <g id="icon-kotlin">
      <path d="M-16 -16 H0 L-16 0.9Z" fill="url(#kotlinLeft)"/>
      <path d="M0 -16 H16 L0 0 L-16 16 V0.9Z" fill="url(#kotlinTop)"/>
      <path d="M0 0 L16 16 H-16Z" fill="url(#kotlinBottom)"/>
    </g>

    <g id="icon-electron">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#9feaf9" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#9feaf9" stroke-width="1.7"/>
      <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#9feaf9" stroke-width="1.7" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#9feaf9" stroke-width="1.7" transform="rotate(120)"/>
      <circle cx="0" cy="0" r="3" fill="#9feaf9"/>
    </g>

    <g id="icon-vite">
      <path d="M-17 -14 L17 -14 L0 18Z" fill="#646cff"/>
      <path d="M3 -19 L-7 2 L1 0 L-3 15 L12 -6 L4 -4Z" fill="#ffdf5d"/>
    </g>

    <g id="icon-react">
      <g fill="none" stroke="#61dafb" stroke-width="2">
        <ellipse rx="19" ry="7"/>
        <ellipse rx="19" ry="7" transform="rotate(60)"/>
        <ellipse rx="19" ry="7" transform="rotate(120)"/>
      </g>
      <circle r="3.5" fill="#61dafb"/>
    </g>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>

  <g filter="url(#auroraBlur)" opacity=".7">
    <ellipse cx="350" cy="100" rx="330" ry="75" fill="url(#auroraBlue)">
      <animate attributeName="cx" values="250;650;250" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="65;110;65" dur="9s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="850" cy="180" rx="400" ry="85" fill="url(#auroraCyan)">
      <animate attributeName="cx" values="900;550;900" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;90;170" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="85;125;85" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="600" cy="320" rx="380" ry="65" fill="url(#auroraBlue)">
      <animate attributeName="cx" values="500;850;500" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="310;250;310" dur="15s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <circle cx="950" cy="80" r="250" fill="url(#glow)">
    <animate attributeName="r" values="220;290;220" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="350" r="220" fill="url(#glow)">
    <animate attributeName="r" values="180;250;180" dur="8s" repeatCount="indefinite"/>
