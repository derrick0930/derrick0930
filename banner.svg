
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="950" cy="80" r="250" fill="url(#glow)">
    <animate attributeName="r" values="220;290;220" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="350" r="220" fill="url(#glow)">
    <animate attributeName="r" values="180;250;180" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated particles -->
  <g fill="#7dd3fc">
    <circle cx="100" cy="70" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="310" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="65" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="300" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="130" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="350" r="3">
      <animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="170" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="50" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="350" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="250" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="220" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Welcome text -->
  <text x="100" y="115"
        fill="#7dd3fc"
        font-family="Consolas, monospace"
        font-size="16"
        letter-spacing="3">
    &gt; WELCOME TO MY PROFILE
  </text>

  <!-- Typing animation -->
  <g font-family="Consolas, monospace"
     font-size="68"
     font-weight="bold"
     fill="#f0f9ff">
    <text x="100" y="215">
      <tspan opacity="0">D<animate attributeName="opacity" from="0" to="1" begin=".5s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">e<animate attributeName="opacity" from="0" to="1" begin=".7s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">r<animate attributeName="opacity" from="0" to="1" begin=".9s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">r<animate attributeName="opacity" from="0" to="1" begin="1.1s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" from="0" to="1" begin="1.3s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">c<animate attributeName="opacity" from="0" to="1" begin="1.5s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">k<animate attributeName="opacity" from="0" to="1" begin="1.7s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">0<animate attributeName="opacity" from="0" to="1" begin="1.9s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">9<animate attributeName="opacity" from="0" to="1" begin="2.1s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">3<animate attributeName="opacity" from="0" to="1" begin="2.3s" dur=".01s" fill="freeze"/></tspan><tspan opacity="0">0<animate attributeName="opacity" from="0" to="1" begin="2.5s" dur=".01s" fill="freeze"/></tspan>
    </text>
  </g>

  <!-- Typing cursor -->
  <rect x="100" y="157" width="4" height="65" rx="1" fill="#38bdf8">
    <animate attributeName="x"
      values="100;141;182;223;264;305;346;387;428;469;510;551"
      keyTimes="0;.0833;.1667;.25;.3333;.4167;.5;.5833;.6667;.75;.8333;1"
      begin=".5s" dur="2s" fill="freeze"/>
    <animate attributeName="opacity"
      values="1;1;0;0;1"
      keyTimes="0;.45;.5;.9;1"
      dur="1s" begin="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Underline -->
  <rect x="100" y="245" width="450" height="2" rx="1"
        fill="#38bdf8" opacity=".5">
    <animate attributeName="width"
      values="0;450" dur="1.2s" begin="2.7s" fill="freeze"/>
  </rect>

  <!-- Instagram card -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1"
      begin="3.1s" dur=".8s" fill="freeze"/>

    <rect x="100" y="275" width="330" height="76" rx="12"
          fill="url(#card)" stroke="#38bdf8" stroke-opacity=".45"/>

    <rect x="116" y="290" width="46" height="46" rx="12"
          fill="#0ea5e9" fill-opacity=".2"
          stroke="#38bdf8" stroke-opacity=".5"/>

    <rect x="129" y="302" width="20" height="20" rx="6"
          fill="none" stroke="#7dd3fc" stroke-width="2"/>

    <circle cx="139" cy="312" r="5"
            fill="none" stroke="#7dd3fc" stroke-width="2"/>

    <circle cx="145" cy="306" r="1.5" fill="#7dd3fc"/>

    <text x="176" y="304" fill="#7dd3fc"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="12" letter-spacing="1.5">
      INSTAGRAM
    </text>

    <text x="176" y="329" fill="#f0f9ff"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="19" font-weight="600">
      derrick0930_
    </text>
  </g>

  <!-- Gmail card -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1"
      begin="3.4s" dur=".8s" fill="freeze"/>

    <rect x="450" y="275" width="390" height="76" rx="12"
          fill="url(#card)" stroke="#38bdf8" stroke-opacity=".45"/>

    <rect x="466" y="290" width="46" height="46" rx="12"
          fill="#0ea5e9" fill-opacity=".2"
          stroke="#38bdf8" stroke-opacity=".5"/>

    <path d="M478 320V304L489 313L500 304V320"
          fill="none" stroke="#7dd3fc"
          stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M478 304L489 313L500 304"
          fill="none" stroke="#7dd3fc"
          stroke-width="2.5" stroke-linecap="round"/>

    <text x="526" y="304" fill="#7dd3fc"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="12" letter-spacing="1.5">
      GMAIL
    </text>

    <text x="526" y="329" fill="#f0f9ff"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="17" font-weight="600">
      vittopop78@gmail.com
    </text>
  </g>

  <!-- Footer -->
  <text x="1090" y="365" text-anchor="end"
        fill="#7dd3fc" opacity=".5"
        font-family="Consolas, monospace" font-size="12">
    DERRICK0930 / 2026
  </text>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="360"
        rx="12" fill="none"
        stroke="#38bdf8" stroke-opacity=".2"/>
</svg>
