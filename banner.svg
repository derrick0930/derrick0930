        <use xlink:href="#icon-kotlin"/>
        <text class="tech-label" x="0" y="43">KOTLIN</text>
      </g>

      <g transform="translate(1140 145)">
        <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
        <use xlink:href="#icon-electron"/>
        <text class="tech-label" x="0" y="43">ELECTRON</text>
      </g>

      <g transform="translate(1220 145)">
        <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
        <use xlink:href="#icon-vite"/>
        <text class="tech-label" x="0" y="43">VITE</text>
      </g>

      <g transform="translate(1300 145)">
        <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
        <use xlink:href="#icon-react"/>
        <text class="tech-label" x="0" y="43">REACT</text>
      </g>

      <g transform="translate(720 0)">
        <g transform="translate(660 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-html"/>
          <text class="tech-label" x="0" y="43">HTML5</text>
        </g>
        <g transform="translate(740 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-css"/>
          <text class="tech-label" x="0" y="43">CSS3</text>
        </g>
        <g transform="translate(820 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-js"/>
          <text class="tech-label" x="0" y="43">JAVASCRIPT</text>
        </g>
        <g transform="translate(900 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-php"/>
          <text class="tech-label" x="0" y="43">PHP</text>
        </g>
        <g transform="translate(980 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-cpp"/>
          <text class="tech-label" x="0" y="43">C++</text>
        </g>
        <g transform="translate(1060 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-kotlin"/>
          <text class="tech-label" x="0" y="43">KOTLIN</text>
        </g>
        <g transform="translate(1140 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-electron"/>
          <text class="tech-label" x="0" y="43">ELECTRON</text>
        </g>
        <g transform="translate(1220 145)">
          <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
          <use xlink:href="#icon-vite"/>
          <text class="tech-label" x="0" y="43">VITE</text>
