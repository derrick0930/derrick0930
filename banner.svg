        from="0 0" to="-720 0" dur="16s" repeatCount="indefinite"/>

      <g transform="translate(660 145)">
        <rect class="tech-card" x="-29" y="-29" width="58" height="58" rx="13"/>
        <use xlink:href="#icon-html"/>
        <text class="tech-label" x="0" y="43">HTML5</text>
