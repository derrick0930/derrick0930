  <g fill="#bae6fd">
    <circle cx="90" cy="60" r="1.5">
      <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="45" r="2">
      <animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="65" r="1.5">
      <animate attributeName="opacity" values=".1;.9;.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="45" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="55" r="1.5">
      <animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="150" r="2">
      <animate attributeName="opacity" values=".1;1;.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="230" r="1.5">
      <animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="250" r="1.5">
      <animate attributeName="opacity" values=".1;.8;.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="360" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="355" r="1.5">
      <animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="355" r="2">
      <animate attributeName="opacity" values=".1;1;.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="330" r="1.5">
      <animate attributeName="opacity" values=".2;.8;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="100" y="105" fill="#7dd3fc"
        font-family="Consolas, monospace"
        font-size="14" letter-spacing="3">
    &gt; WELCOME TO MY PROFILE
  </text>

  <rect x="100" y="116" width="240" height="2" rx="1" fill="#38bdf8"/>

  <g fill="#e0f2fe" font-family="Consolas, monospace"
     font-size="68" font-weight="bold">
    <text x="100" y="205">
      <tspan opacity="0">D<animate attributeName="opacity" from="0" to="1" begin="0s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="141" opacity="0">e<animate attributeName="opacity" from="0" to="1" begin=".18s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="182" opacity="0">r<animate attributeName="opacity" from="0" to="1" begin=".36s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="223" opacity="0">r<animate attributeName="opacity" from="0" to="1" begin=".54s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="264" opacity="0">i<animate attributeName="opacity" from="0" to="1" begin=".72s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="305" opacity="0">c<animate attributeName="opacity" from="0" to="1" begin=".90s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="346" opacity="0">k<animate attributeName="opacity" from="0" to="1" begin="1.08s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="387" opacity="0">0<animate attributeName="opacity" from="0" to="1" begin="1.26s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="428" opacity="0">9<animate attributeName="opacity" from="0" to="1" begin="1.44s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="469" opacity="0">3<animate attributeName="opacity" from="0" to="1" begin="1.62s" dur=".01s" fill="freeze"/></tspan>
      <tspan x="510" opacity="0">0<animate attributeName="opacity" from="0" to="1" begin="1.80s" dur=".01s" fill="freeze"/></tspan>
    </text>
  </g>

  <rect x="96" y="150" width="3" height="65" rx="1" fill="#38bdf8">
    <animate attributeName="x"
      values="96;100;141;182;223;264;305;346;387;428;469;510;551"
      keyTimes="0;.02;.10;.18;.26;.34;.42;.50;.58;.66;.74;.82;1"
      begin="0s" dur="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1"
      keyTimes="0;.5;.6;.8;1" begin="2s" dur="1s"
      repeatCount="indefinite"/>
  </rect>

  <g mask="url(#techMask)">
    <g>
